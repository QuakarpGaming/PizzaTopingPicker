<html>
    <head>
        <title>God Cannot help you, but we can get you pizza topings</title>
        <link rel="Stylesheet" href="Styles.css">
    </head>
    <body>
        <fieldset class="down" id="peopleList">
            <!--
            TODO
            -in the read google sheet call, add the HTML genneration
            -add the JS to check and update the topings
            -default Blank rows to M
        -->
            <legend>People</legend>
        </fieldset>
        <fieldset class="down leftCol" id="yes">
            <legend>Get</legend>
        </fieldset>

        <fieldset class="down leftCol" id="maybe">
            <legend>Maybe</legend>
        </fieldset>

        <fieldset class="down leftCol" id="no">
            <legend>Thats a no for me,dog</legend>
        </fieldset>
    </body>
</html>
<script>

    const spreadsheetId = '176Bgd3bxvrtFnCZTZnZFbm7hIHKAUxioBJuQDfznwck';
    const gid = '0';
    var toppings = [];
    var names = [];
    var data = {};

    function recalc() {
        var results = {}
        names.forEach((name) => {
            //see if checked
            var isChecked = document.getElementById(name.replace(" ", "_")).checked
            if (isChecked)
            {
                var dataRow = data[name];
                toppings.forEach((top) => {
                    //check results for topping
                    var currentToppingResult = results[top];
                    if (currentToppingResult == undefined)
                    {
                        //add if not there yet
                        results[top] = "";
                        currentToppingResult = "";
                    }
                    if (currentToppingResult != "N") {
                        var personPrefernce = data[name][top];
                        if (personPrefernce == undefined || personPrefernce == "") {
                            personPrefernce = "M";
                        }

                        if ((currentToppingResult == "Y" && personPrefernce != "Y")
                            || (currentToppingResult == "M" && personPrefernce == "N")
                            || (currentToppingResult == "")
                        )
                        {
                            results[top] = personPrefernce;
                        }
                    }
                })
            }
        })
        var yesStr = "";
        var maybeStr = ""
        var noString = "";
        toppings.forEach((top) => {
            switch (results[top]) {
                case "Y":
                    yesStr += `<label class="yes">${top}</label>`;
                    break;
                case "N":
                    noString += `<label class="no">${top}</label>`;
                    break;
                default:
                    maybeStr += `<label class="maybe">${top}</label>`;
            }
        })

       
        var yesFieldSet = document.getElementById("yes")
        yesFieldSet.innerHTML = `<legend>GET</legend>`
        yesFieldSet.innerHTML += yesStr;

        var maybeFieldSet = document.getElementById("maybe")
        maybeFieldSet.innerHTML = `<legend>Maybe</legend>`
        maybeFieldSet.innerHTML += maybeStr;

        var noFieldSet = document.getElementById("no")
        noFieldSet.innerHTML = `<legend>Thats a no for me, dog</legend>`
        noFieldSet.innerHTML += noString;
    }


    async function readGoogleSheetCSV() {
        try {
            fetch(`https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&gid=0`)
                .then(res => res.text())
                .then(text => {
                    var rows = text.split(/\r?\n/);
                    var headers = text.split(/\r?\n/)[0].split(','); 
                    //get the topping and store them
                    headers.forEach((x) => {
                        if (x != "Name")
                            toppings.push(x)
                    })

                    //grab the container
                    var namesContainer = document.getElementById("peopleList")
                    //start the JSON STRING
                    var JSONData = "{"
                    for (var i = 1; i < rows.length; i++)
                    {
                        let cols = rows[i].split(',')
                        var newJSONRowString = `"${cols[0]}":{`;//get name
                        names.push(cols[0]);
                        namesContainer.innerHTML += `<label>${cols[0]}&nbsp;<input type="checkbox" checked id="${cols[0].replace(" ","_")}" onchange="recalc()"></label>`
                        for (var o = 1; o < cols.length; o++)
                        {
                            //starts at one to get toppings and not name
                            newJSONRowString += `"${headers[o]}":"${cols[o].toUpperCase()}",`;
                        }
                        //end the toppings data obj
                        newJSONRowString = newJSONRowString.slice(0, -1) + "},";
                        JSONData += newJSONRowString;
                    }
                    //get rid of the last comma(,) and add the final }
                    JSONData = JSONData.slice(0, -1) + "}";

                    data = JSON.parse(JSONData); // save globally

                })
        } catch (error) {
            console.error("Failed to fetch Google Sheet:", error);
        }
    }

    readGoogleSheetCSV();
</script>
