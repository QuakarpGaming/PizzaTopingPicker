<script>
    // Replace with your actual spreadsheet ID and sheet (gid) ID
    const spreadsheetId = '176Bgd3bxvrtFnCZTZnZFbm7hIHKAUxioBJuQDfznwck';
    const gid = '0'; // '0' is usually the default first tab
    //const url = `https://google.com{spreadsheetId}/export?format=csv&gid=${gid}`;
    //const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json`;
    var rows = {}
    async function readGoogleSheetCSV() {
        try {
            fetch(`https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&gid=0`)
                .then(res => res.text())
                .then(text => {
                    var rows = text.split(/\r?\n/);
                    var headers = text.split(/\r?\n/)[0].split(','); 
                    var JSONData = "{"
                    for (var i = 1; i < rows.length; i++)
                    {
                        let cols = rows[i].split(',')
                        var newJSONRowString = `"${cols[0]}":{`;
                        for (var o = 1; o < cols.length; o++)
                        {
                            newJSONRowString += `"${headers[o]}:"${cols[o]}",`;
                        }
                        newJSONRowString = newJSONRowString.slice(0, -1) + "},";
                        JSONData += newJSONRowString;
                    }
                    JSONData = JSONData.slice(0, -1) + "}";

                    var testJSONDATA = JSON.parse(JSONData);
                    console.log(testJSONDATA);
                })
        } catch (error) {
            console.error("Failed to fetch Google Sheet:", error);
        }
    }

    readGoogleSheetCSV();
</script>
